<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>654 Extension - Configuration</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #333;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #8B5CF6 0%, #22D3EE 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .user-info {
      margin-bottom: 20px;
      padding: 12px;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.1) 0%, rgba(34, 211, 238, 0.1) 100%);
      border-radius: 8px;
      border: 1px solid rgba(139, 92, 246, 0.2);
    }

    .user-info-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8B5CF6;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .user-info-email {
      font-size: 14px;
      font-weight: 500;
      color: #333;
      font-family: 'SF Mono', Monaco, monospace;
    }

    .user-info-error {
      font-size: 13px;
      color: #dc2626;
      font-style: italic;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      font-family: 'SF Mono', Monaco, monospace;
    }

    input:focus {
      outline: none;
      border-color: #0073b1;
    }

    .btn {
      width: 100%;
      padding: 10px;
      background: #0073b1;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #005a8d;
    }

    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #6c757d;
    }

    .btn-secondary:hover {
      background: #5a6268;
    }

    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
      display: none;
    }

    .status.visible {
      display: block;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .info {
      margin-top: 20px;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 4px;
      font-size: 12px;
      color: #666;
    }

    .info-title {
      font-weight: 600;
      margin-bottom: 6px;
    }

    .info-item {
      margin: 4px 0;
    }

    code {
      font-family: 'SF Mono', Monaco, monospace;
      background: #e9ecef;
      padding: 2px 4px;
      border-radius: 2px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <h1>654 Extension</h1>

  <!-- État non connecté -->
  <div id="login-section" style="display: none;">
    <p style="margin-bottom: 16px; color: #666; font-size: 14px;">
      Connectez-vous avec votre compte Google @321.com pour utiliser l'extension.
    </p>
    <button id="login-btn" class="btn">
      <svg width="18" height="18" viewBox="0 0 18 18" style="margin-right: 8px;">
        <path fill="#4285F4" d="M17.64,9.2c0,-0.63 -0.06,-1.25 -0.16,-1.84H9v3.48h4.84c-0.21,1.13 -0.84,2.08 -1.79,2.71v2.26h2.9c1.7,-1.56 2.68,-3.87 2.68,-6.61z"/>
        <path fill="#34A853" d="M9,18c2.43,0 4.47,-0.81 5.96,-2.19l-2.9,-2.26c-0.81,0.54 -1.84,0.86 -3.06,0.86 -2.35,0 -4.34,-1.59 -5.06,-3.73H1v2.33c1.49,2.96 4.57,4.99 8,4.99z"/>
        <path fill="#FBBC05" d="M3.94,10.68c-0.18,-0.54 -0.28,-1.11 -0.28,-1.68s0.1,-1.14 0.28,-1.68V4.99H1c-0.62,1.24 -0.97,2.64 -0.97,4.09s0.35,2.85 0.97,4.09l2.94,-2.49z"/>
        <path fill="#EA4335" d="M9,3.58c1.32,0 2.51,0.45 3.44,1.35l2.58,-2.58C13.46,0.89 11.43,0 9,0 5.57,0 2.49,2.04 1,4.99l2.94,2.49c0.72,-2.14 2.71,-3.73 5.06,-3.73z"/>
      </svg>
      Se connecter avec Google
    </button>
  </div>

  <!-- État connecté -->
  <div id="logged-in-section" style="display: none;">
    <div class="user-info">
      <div class="user-info-label">Connecté en tant que</div>
      <div class="user-info-email" id="user-email"></div>
    </div>
    <button id="logout-btn" class="btn btn-secondary">Se déconnecter</button>
  </div>

  <div id="status" class="status"></div>

  <div class="info">
    <div class="info-title">Informations</div>
    <div class="info-item">
      Endpoint: <code>POST /api/browser/session</code>
    </div>
    <div class="info-item">
      Sur LinkedIn, cliquez sur le bouton flottant pour envoyer vos cookies.
    </div>
  </div>

  <!-- auth.js removed - OAuth handled in background.js -->
  <script src="popup.js"></script>
</body>
</html>
